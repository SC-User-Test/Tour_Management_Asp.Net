apiVersion: apps/v1
kind: Deployment
metadata:
  name: tour-management
  namespace: tour-management
  labels:
    app: tour-management
    version: v1
    managed-by: kubectl
spec:
  replicas: 2
  selector:
    matchLabels:
      app: tour-management
  template:
    metadata:
      labels:
        app: tour-management
        version: v1
    spec:
      nodeSelector:
        kubernetes.io/os: windows
      containers:
      - name: tour-management
        image: {{IMAGE_URI}}
        ports:
        - containerPort: 80
          protocol: TCP
          name: http
        env:
        - name: DB_CONNECTION_STRING
          value: "{{DB_CONNECTION_STRING}}"
        - name: ASPNET_ENVIRONMENT
          value: "Production"
        - name: TZ
          value: "UTC"
        resources:
          requests:
            cpu: "500m"
            memory: "1Gi"
          limits:
            cpu: "1000m"
            memory: "2Gi"
        livenessProbe:
          httpGet:
            path: /
            port: 80
            scheme: HTTP
          initialDelaySeconds: 90
          periodSeconds: 30
          timeoutSeconds: 10
          successThreshold: 1
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /
            port: 80
            scheme: HTTP
          initialDelaySeconds: 60
          periodSeconds: 15
          timeoutSeconds: 5
          successThreshold: 1
          failureThreshold: 3
        startupProbe:
          httpGet:
            path: /
            port: 80
            scheme: HTTP
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          successThreshold: 1
          failureThreshold: 10
      restartPolicy: Always
      terminationGracePeriodSeconds: 60
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: tour-management-config
  namespace: tour-management
data:
  aspnet.environment: "Production"
  timezone: "UTC"